    proyectos:
    - name: '[Pásame el Código](https://pc.pablopl.dev)'
      summary: Una web open source con apuntes y ejercicios resueltos de las diferentes
        asignaturas que componen el Grado de Enxeñería Informática da Universidade
        da Coruña. Derivado de mi proyecto inicial Pro2324 por las limitaciones de
        usar un programa de documentación, decidí crear un sitio dedicado a la idea
        de compartir apuntes y ejercicios de la carrera de la manera más cómoda posible.
        Basándome en la plantilla Starlight creé un sitio en Astro que mantengo actualmente
        y que trato de mejorar constantemente.
      start_date: 2024-10
      highlights:
      - Proyecto Personal
    - name: '[MandaRef](https://github.com/TeenBiscuits/MandaRef)'
      summary: Este proyecto realizado durante la HackUDC 2025 surge de la idea de
        que los usuarios, puedan encontrar la ropa que ven en un vídeo de Tik Tok
        o cualquier otra red social, tan solo con una captura de pantalla o buscando
        por texto con una descripción ded lo que quieren. Para ello, hemos creado
        una aplicación móvil nativa en React, apoyándonos en la API de Visual Search
        de Inditex, en la cual, mediante una imagen o un texto, encontramos esa misma
        prenda y/o prendas relacionadas con ella.
      start_date: 2025-02
      end_date: 2025-02
      highlights:
      - HackUDC 2025
    - name: '[Pro2324](https://github.com/TeenBiscuits/Pro2324)'
      summary: Una pequeña página web open source que construí en primero de carrera
        y mantuve, con pequeñas contribuciones de compañeros de carrera, para ayudar
        a otros a entender y superar las asignaturas de Programación 1 y 2. El contenido
        de la web fue escrito en su amplia mayoría por mi, contaba tanto con apuntes
        detallados como con cientos de ejemplos y ejercicios resueltos en el lenguaje
        de programación C. Fue un proyecto pequeño pero que guardo con cariño.
      start_date: 2024-01
      end_date: 2024-10
      highlights:
      - Proyecto Personal
    - name: '[CronoSquare](https://github.com/TeenBiscuits/CronoSquare)'
      summary: Un pequeño minijuego de rompecabezas creado en HTML5 para la HackUDC
        2024. Ganador del Premio GPUL x INDITEX Tech al proyecto más original.
      start_date: 2024-02
      end_date: 2024-02
      highlights:
      - HackUDC 2024
    - name: Criptografía
      summary: El objetivo de este trabajo es conocer y comprender los conceptos básicos
        del sistema RSA para poder enviar mensajes de forma segura. En primer lugar,
        para entender el RSA recogeremos los fundamentos matemáticos que lo sustentan
        y nos centraremos en su eficacia en relación al tiempo necesario para romperlo.
        Además, pondremos en práctica el algoritmo con una construcción teórica. Finalmente,
        se discutirá por qué las computadoras cuánticas pueden romper este sistema
        y suponer un riesgo actual.
      start_date: 2021-09
      end_date: 2023-06
      highlights:
      - Proyecto de STEMbach
