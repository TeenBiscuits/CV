    projects:
    - name: '[Pass Me the Code](https://pc.pablopl.dev)'
      summary: An open-source website with notes and solved exercises from the different
        subjects that make up the Computer Engineering degree at the University of
        A Coruña. Derived from my initial project Pro2324 due to the limitations of
        using a documentation program, I decided to create a site dedicated to the
        idea of sharing course notes and exercises in the most convenient way possible.
        Based on the Starlight template, I created a site in Astro that I currently
        maintain and continually try to improve.
      start_date: 2024-10
      highlights:
      - Personal Project
    - name: '[MandaRef](https://github.com/TeenBiscuits/MandaRef)'
      summary: This project, developed during HackUDC 2025, stems from the idea that
        users can find the clothes they see in a TikTok video or any other social
        network with just a screenshot, or by searching text with a description of
        what they want. To achieve this, we built a native mobile application in React,
        leveraging Inditex’s Visual Search API, which, using an image or text, finds
        that same garment and/or related items.
      start_date: 2025-02
      end_date: 2025-02
      highlights:
      - HackUDC 2025
    - name: '[Pro2324](https://github.com/TeenBiscuits/Pro2324)'
      summary: A small open-source website I built in my first year and maintained,
        with small contributions from classmates, to help others understand and pass
        Programming 1 and 2. The site’s content was written mostly by me and included
        detailed notes as well as hundreds of examples and solved exercises in the
        C programming language. It was a small project, but one I look back on fondly.
      start_date: 2024-01
      end_date: 2024-10
      highlights:
      - Personal Project
    - name: '[CronoSquare](https://github.com/TeenBiscuits/CronoSquare)'
      summary: A small HTML5 puzzle minigame created for HackUDC 2024. Winner of the
        GPUL x INDITEX Tech Award for the most original project.
      start_date: 2024-02
      end_date: 2024-02
      highlights:
      - HackUDC 2024
    - name: Cryptography
      summary: The goal of this work is to learn and understand the basic concepts
        of the RSA system to be able to send messages securely. First, to understand
        RSA, we will cover the mathematical foundations that support it and focus
        on its effectiveness in relation to the time required to break it. In addition,
        we will put the algorithm into practice with a theoretical construction. Finally,
        we will discuss why quantum computers can break this system and pose a current
        risk.
      start_date: 2021-09
      end_date: 2023-06
      highlights:
      - STEMbach Project
