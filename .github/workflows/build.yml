# With some help from: https://gist.github.com/dgerosa/2e1f47a39180f39bde848e38243efa94

name: build
on:
  push:
    branches:
      - main
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      resume: ${{ steps.filter.outputs.resume }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            resume:
              - '**.yml'
              - '**.yaml'
  build:
    needs: check
    if: needs.check.outputs.resume == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        
      - name: Build resumes with RenderCV
        run: |
          uv tool install "rendercv[full]"
          rendercv render cv.yaml --pdf-path cv.pdf --dont-generate-html --dont-generate-markdown --dont-generate-png
          rendercv render cv_en.yaml --pdf-path cv_en.pdf --dont-generate-html --dont-generate-markdown --dont-generate-png
          
      - name: move
        run: mkdir -p github_artifacts && mv cv.pdf cv_en.pdf ./github_artifacts/
        
      - name: Upload cv.pdf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv.pdf
          path: ./github_artifacts/cv.pdf
          
      - name: Upload cv_en.pdf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv_en.pdf
          path: ./github_artifacts/cv_en.pdf
          
  deploy:
    needs: [check, build]
    if: needs.check.outputs.resume == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: github_artifacts
      - name: move
        run: mkdir -p github_deploy && mv github_artifacts/*/* github_deploy
      - name: deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: true
          
  copy-index-to-build:
    needs: [check, deploy]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy To Branches Action
        uses: planetoftheweb/copy-to-branches@v1.3
        env:
          key: main
          branches: build
          files: index.html 404.html CNAME icons/* en/index.html es/index.html